<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Team Mongolia</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#F4F6F9;color:#0F172A;font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:420px;display:grid;gap:14px}
.logo{height:44px;justify-self:center;margin-bottom:6px}
h1{margin:0;text-align:center;font-size:1.3rem;font-weight:700}
p.lead{margin:0 0 6px;text-align:center;color:#5B6474}
a.opt{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E2E6EC;border-radius:12px;padding:16px 18px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:border-color .12s,box-shadow .12s}
a.opt:hover{border-color:#1D4ED8;box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.ic{flex:none;width:44px;height:44px;border-radius:10px;background:#E8EFFD;display:grid;place-items:center;font-size:22px}
b{display:block;font-size:1rem}span.s{color:#5B6474;font-size:.88rem}
.arr{margin-left:auto;color:#94A3B8;font-size:1.2rem}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="icons/logo.png" alt="STM">
  <h1>Student Team Mongolia</h1>
  <p class="lead">Аль хэсэгт нэвтрэх вэ?</p>
  <a class="opt" href="index.html"><div class="ic">🎓</div><div><b>Оюутан</b><span class="s">Ажлын зар, ээлж, ирц, цалин</span></div><span class="arr">›</span></a>
  <a class="opt" href="company.html"><div class="ic">🏢</div><div><b>Байгууллага</b><span class="s">Захиалга өгөх, гэрээ, ирцийн QR</span></div><span class="arr">›</span></a>
  <a class="opt" href="admin.html"><div class="ic">🛠</div><div><b>Админ</b><span class="s">STM-ийн удирдлага</span></div><span class="arr">›</span></a>
</main>
</body>
</html>
